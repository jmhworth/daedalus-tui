# Tunables for personal shared-Supabase scaffold + ecosystem activate.
# Secrets never belong here; canonical connection values live in the Daedalus TUI root .env.
snippet_version = 1
maximum_schema_name_length = 100
env_schema_key = "SUPABASE_SCHEMA"
env_url_key = "SUPABASE_URL"
env_project_ref_key = "SUPABASE_PROJECT_REF"
# Preferred API keys (Supabase publishable + secret). Legacy and "private" aliases still resolve.
env_publishable_key = "SUPABASE_PUBLISHABLE_KEY"
env_secret_key = "SUPABASE_SECRET_KEY"
env_publishable_key_aliases = ["SUPABASE_ANON_KEY"]
env_secret_key_aliases = ["SUPABASE_PRIVATE_KEY", "SUPABASE_SERVICE_ROLE_KEY"]
env_db_url_key = "SUPABASE_DB_URL"
env_db_url_ipv4_key = "SUPABASE_DB_URL_IPV4"
env_db_url_ipv6_key = "SUPABASE_DB_URL_IPV6"
env_access_token_key = "SUPABASE_ACCESS_TOKEN"
# Documented keys for the active project's ignored .env (database URL variants are optional alternatives).
canonical_env_keys = [
  "SUPABASE_URL",
  "SUPABASE_PUBLISHABLE_KEY",
  "SUPABASE_SECRET_KEY",
  "SUPABASE_PROJECT_REF",
  "SUPABASE_DB_URL",
  "SUPABASE_DB_URL_IPV4",
  "SUPABASE_DB_URL_IPV6",
]
# Conceptually required after alias resolution (project ref may be derived from URL).
required_env_keys = [
  "SUPABASE_URL",
  "SUPABASE_PUBLISHABLE_KEY",
  "SUPABASE_SECRET_KEY",
]
migration_directory = "daedalus-migrations"
migration_filename_pattern = "<YYYYMMDDHHMM>_<schema>_<description>.sql"
initial_migration_description = "create_schema"
profile_section_heading = "## Personal Supabase Schema"
confirmation_title = "Activate personal Supabase?"
confirmation_warning = "Activate assumes this project's remote schema is blank and applies its daedalus-migrations/ SQL through the Daedalus TUI root. It does not clear remote objects or migration history. Set up a blank schema before activating. Activate also commits the scaffold locally and runs the migration apply; it does not publish Git changes."
confirmation_name_prompt = "Type this project name exactly to confirm:"
confirmation_button_label = "Activate"
wizard_title = "Personal Supabase setup"
wizard_scaffold_done = "Scaffold files are in place for schema {schema}."
wizard_env_instructions = "Next, edit the Daedalus TUI .env file and set:\n\n  {env_path}\n\n  SUPABASE_URL=...\n  SUPABASE_PUBLISHABLE_KEY=...\n  SUPABASE_SECRET_KEY=...\n  SUPABASE_ACCESS_TOKEN=... # optional; required only when exposing the hosted Data API schema\n  SUPABASE_DB_URL=...   # database connection, or use one of the family-specific URLs\n  SUPABASE_DB_URL_IPV4=...   # optional IPv4 Session pooler connection\n  SUPABASE_DB_URL_IPV6=...   # optional IPv6 direct connection\n\nOn Activate, Daedalus copies the API URL, publishable/secret keys, project ref, and registered schema into a managed block at the end of this project's ignored .env so its app can read and write data. Keep the access token and database URLs in the TUI root .env; they are never copied into the project. Re-Activate after changing credentials to refresh the project block.\n\nThis project's application data belongs in the registered schema {schema}, never public. Activate assumes that remote schema is blank and applies SQL from daedalus-migrations/ through the Daedalus TUI root. It grants schema and table access to service_role only. After activation completes, use Expose schema when the app should access it through the hosted Supabase Data API; exposure can also be retried later by activating the already-activated project and pressing that button. Exposure preserves existing PostgREST schemas. Activation does not clear remote objects or migration history. Set up a blank schema before activating. When multiple URLs are set, Activate probes IPv4, then IPv6, then the default URL and uses the reachable URL. Copy URLs from Supabase Dashboard > Connect. Project ref is optional when SUPABASE_URL is https://<ref>.supabase.co.\nMigration files use <YYYYMMDDHHMM>_<schema>_<description>.sql. Agents put SQL only in daedalus-migrations/ and never run Supabase CLI commands.\nContinue re-checks the TUI .env file in a separate process and only looks at the exit code.\n\nWhen the values are saved, continue."
wizard_env_missing = "Environment variables still not detected."
wizard_continue_label = "Continue"
wizard_cancel_label = "Cancel"
activate_commit_message = "Add personal Supabase schema scaffold."
activate_status_commit_message = "Mark personal Supabase schema activated."
preflight_timeout_seconds = 15
direct_database_dns_hint = "The direct db.* endpoint is IPv6 by default; if this machine or network cannot use it, open Supabase Dashboard > Connect, choose Session pooler, and replace SUPABASE_DB_URL with that full connection string (port 5432)."
activation_progress_title = "Personal Supabase activation"
activation_progress_subtitle = "The project migration files, Git, connectivity, and root-owned migration steps will appear here."
activation_progress_stages = [
  "Scaffold project migration files",
  "Validate scaffold",
  "Commit scaffold changes",
  "Validate environment",
  "Check Supabase connection",
  "Synchronize and apply migrations from the Daedalus TUI root",
]
management_api_timeout_seconds = 15
activation_progress_close_label = "Close"
