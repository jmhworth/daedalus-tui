providers = [
  { label = "Codex", value = "codex" },
  { label = "Claude Code", value = "claude" },
  { label = "Cursor CLI", value = "cursor" },
]

codex_models = [
  { label = "GPT-6 Astra", value = "gpt-6-astra" },
  { label = "GPT-5.6 Luna", value = "gpt-5.6-luna" },
  { label = "GPT-5.6 Terra", value = "gpt-5.6-terra" },
  { label = "GPT-5.6 Sol", value = "gpt-5.6-sol" },
]

codex_reasoning = [
  { label = "Light", value = "light" },
  { label = "Medium", value = "medium" },
  { label = "High", value = "high" },
  { label = "Extra high", value = "extra-high" },
]

# Claude Code models are passed to `claude --model`. Full model ids are used
# instead of the moving `opus`/`sonnet` aliases so a task's recorded selection
# keeps meaning the same model later.
claude_models = [
  { label = "Opus 5", value = "claude-opus-5" },
  { label = "Sonnet 5", value = "claude-sonnet-5" },
  { label = "Fable 5.1", value = "claude-fable-5-1" },
  { label = "Haiku 4.5", value = "claude-haiku-4-5-20251001" },
]

# Claude Code exposes effort directly through `claude --effort`, so it gets its
# own scale rather than reusing the Codex reasoning mapping. `max` has no Codex
# equivalent.
claude_reasoning = [
  { label = "Light", value = "light" },
  { label = "Medium", value = "medium" },
  { label = "High", value = "high" },
  { label = "Extra high", value = "extra-high" },
  { label = "Max", value = "max" },
]

modes = [
  { label = "Coding", value = "coding" },
  { label = "Ask", value = "ask" },
  { label = "Plan", value = "plan" },
]

[defaults]
provider = "codex"
model = "gpt-6-astra"
reasoning = "high"

[cursor]
label = "Cursor CLI"
value = "cursor"

# Claude Code permission handling for non-interactive task runs. `acceptEdits`
# auto-approves file edits and matches the profile boundary that agents edit
# files rather than execute source code; orchestration still runs verification
# itself. `bypassPermissions` grants Codex-equivalent autonomy including
# command execution, without Codex's workspace sandbox.
[claude]
permission_mode = "acceptEdits"
# Bash commands Claude Code may run without a prompt under acceptEdits. Claude
# runs non-interactively (`claude --print`), so nobody can approve a prompt:
# anything not listed here, and not one of the project's verification commands
# (which orchestration adds automatically per task), is denied outright.
allowed_tools = [
  "Bash(npm test:*)", "Bash(npm run:*)", "Bash(npx vitest:*)", "Bash(npx tsc:*)", "Bash(npx eslint:*)",
  "Bash(pytest:*)", "Bash(python -m pytest:*)", "Bash(python3 -m pytest:*)",
  "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)", "Bash(ls:*)",
]

# Provider sign-in. In `account` mode the TUI removes each provider's API-key
# variables from the agent subprocess environment so the CLI falls back to the
# signed-in account and bills the operator's plan instead of API credit. Set
# `mode = "api-key"` to restore key-based execution, which reads keys from the
# process environment and local `.env` files as before.
#
# API keys never belong in this file; only the variable names are listed here.
[auth]
mode = "account"

[auth.codex]
label = "Codex"
api_key_variables = ["OPENAI_API_KEY"]
status_command = ["codex", "login", "status"]
sign_in_command = ["codex", "login"]

[auth.claude]
label = "Claude Code"
api_key_variables = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN"]
status_command = ["claude", "auth", "status"]
sign_in_command = ["claude", "auth", "login"]

[auth.cursor]
label = "Cursor CLI"
api_key_variables = ["CURSOR_API_KEY"]
status_command = ["agent", "status"]
sign_in_command = ["agent", "login"]

# Launch-root project discovery. Daedalus-formatted projects have a
# `feature_files/` directory; `include_git_repositories` also lists plain Git
# checkouts under the launch root so tasks can run against them, and
# `include_all_directories` lists every immediate child directory.
[projects]
include_git_repositories = true
include_all_directories = false
skipped_directory_names = [
  ".git",
  ".daedalus-worktrees",
  ".venv",
  "__pycache__",
  "node_modules",
  # The TUI's own generated prompt and error archives are never projects.
  "prompts",
  "errors",
]

[output]
width = "95%"

# Usage bar (bottom left). Every `interval_seconds` the TUI reads each
# provider's usage and refreshes the bar. Neither CLI offers a non-interactive
# `usage` subcommand (Claude Code waits for a terminal; Codex refuses without
# one), so by default the bar reads the same local data their own /usage and
# /status views show: Codex rate-limit windows from its session logs, and
# Claude Code's per-day token statistics cache, including any `rate_limits`
# payload it provides. Set `command` for a provider to run any program instead;
# it runs with stdin closed and a timeout, and its JSON or first output line is
# shown. JSON rate-limit fields and Claude `context_window` percentages produce
# the same progress bars for Claude.
[usage]
enabled = true
interval_seconds = 60
command_timeout_seconds = 20
codex_sessions_dir = "~/.codex/sessions"
claude_stats_file = "~/.claude/stats-cache.json"
# Codex only writes rate limits after a turn completes, so the most recently
# touched session log is often a just-started session with no usage in it.
# Scan back through this many logs (newest first) before reporting no data.
session_scan_limit = 12
# Only the tail of each session log is read; the newest rate-limit payload is
# always at the end and the files grow without bound.
session_tail_bytes = 262144
# Cells used by each percentage progress bar in the usage panel. The panel
# lives in the fixed-width task sidebar, so keep this well under its width.
bar_width = 12

[usage.claude]
label = "Claude"
command = []

[usage.codex]
label = "Codex"
command = []

# Responsive safety guard and compact dimensions. Above the guard, the TUI
# measures the wide controls' laid-out regions and enters compact mode if any
# control is clipped. Compact mode uses a vertical workspace; short mode
# reduces vertical chrome independently.
[layout]
compact_width = 100
# Switch the wide settings row to the category/value picker when a selector
# cannot provide enough cells for its label and dropdown affordance.
wide_control_min_width = 13
short_height = 32
compact_task_sidebar_height = 8
compact_prompt_height = 4

# Fixed content widths for the task-inbox marker, project, task, and status
# columns. Together with DataTable's cell padding, the defaults fit the
# fixed 44-cell sidebar and leave room for its vertical scrollbar.
[task_inbox]
marker_width = 1
project_width = 9
task_width = 14
status_width = 7

# Fatal Textual exceptions are written to the launch-root debug log
# (see orchestration `debug_log_filename`) and also printed to stderr.
