# Tunable presentation text for the low-frequency Command Menu.
title = "Command Menu"
subtitle = "Choose an action, or press Esc / Ctrl+K to close"

# When true, Command Menu Push pulls remote commits into the operating branch
# before pushing (sync-style). Set false for push-only publishing.
pull_before_push = true

# When true, Sync merge conflicts launch plan-mode recovery in the preserved
# sync worktree (questions to the operator, then auto resolve + push).
sync_conflict_recovery_enabled = true
# Bounded coding attempts when conflict resolutions still leave unmerged paths.
sync_conflict_attempt_limit = 3
# Auto-sync is an in-session preference, initially off each time the TUI starts.
auto_sync_after_completed_tasks = false

[labels]
new_task = "New Task"
new_project = "New Project"
create_topic = "Create Topic"
personal_supabase = "Activate personal Supabase"
remove_personal_supabase = "Remove personal Supabase"
push_branch = "Sync to GitHub"
auto_sync = "Auto-sync after completed tasks"
keyboard_shortcuts = "Keyboard Shortcuts"
