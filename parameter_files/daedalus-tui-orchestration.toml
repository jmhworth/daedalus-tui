# Default seed for the per-project operating branch used as the worktree base
# and promotion destination. Projects may override this in the TUI Branch
# Select; overrides live in launch-root .daedalus-memory.json and never rewrite
# this file. Defaults to main; change this to any local branch name.
# The operator does not need this branch checked out while the TUI runs.
target_branch = "main"
worktree_root = ".daedalus-worktrees"
task_verification_attempt_limit = 3
resolver_attempt_limit = 3
max_concurrent_tasks = 4
agent_timeout_seconds = 450
shutdown_grace_seconds = 8
debug_log_filename = ".daedalus-debug.log"
# A dirty operating branch no longer blocks a task. Orchestration stages the
# pending changes (Daedalus' own runtime files stay untracked), commits them
# with the message below, and publishes the branch to git_remote before the
# task worktree is created. A failed or missing push is reported and the task
# still starts. Set the autocommit flag to false to restore the old
# "primary worktree must be clean" error instead.
dirty_primary_autocommit_enabled = true
dirty_primary_commit_message = "Daedalus: commit pending changes before starting a task"
dirty_primary_push_enabled = true
git_remote = "origin"

graphify_update_enabled = true
graphify_executable = "graphify"
supabase_db_push_enabled = true
supabase_executable = "supabase"

# Firebase-backed projects get their changed Firestore rules and indexes
# deployed after verification passes, the same way Supabase migrations are
# pushed. The deploy runs only for projects registered for Firebase.
firebase_deploy_enabled = true
firebase_executable = "firebase"

# An empty list discovers root and one-level nested npm/pytest suites.
verification_commands = []
