# Orchestrate Mode: one Planner agent decomposes the operator's prompt into
# small task cards and delegates them to several Worker agents. Every value
# below is tuned by hand here; Orchestrate Mode never reads command-line flags.

# Which agent plays each role. The Planner reads the repository and returns a
# JSON plan (it never edits files); Workers run the resulting cards as ordinary
# coding tasks. Both roles are Claude for now; the provider key already exists
# per role so a non-Claude role can be added without a schema change.
[roles]
planner_provider = "claude"
planner_model = "claude-fable-5-1"
planner_reasoning = "high"
worker_provider = "claude"
worker_model = "claude-opus-5"
worker_reasoning = "high"

# Caps that keep a session bounded. Every loop in Orchestrate Mode ends by
# exhausting one of these rather than by running forever. The character budgets
# are what keeps a worker's context small: a worker sees one card, and the
# planner sees a bounded digest instead of worker transcripts.
[limits]
default_max_workers = 3         # workers preselected in the max-workers control
max_workers_limit = 8           # upper bound the UI control allows
planner_round_limit = 6         # planner rounds per session, including the first
task_reissue_limit = 2          # times one card may be re-issued after failure
planner_digest_budget_chars = 12000
worker_report_budget_chars = 4000
worker_card_budget_chars = 6000

# Where session artifacts live. Session files (plan, cards, reports, digests)
# are written under the TUI storage root; the card the worker actually ticks is
# written into its worktree under the runtime-artifact directory, which Git
# never stages because it is registered as one of Daedalus' own runtime files.
[files]
session_dirname = "orchestrate"
card_filename = "task.md"
runtime_artifact_dirname = ".daedalus-orchestration"

# Orchestrate view dimensions: the board's Title column width and how many
# lines of planner output the log keeps before discarding the oldest.
[ui]
board_title_width = 28
planner_log_lines = 400
